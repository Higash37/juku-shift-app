<!doctype html>
<!-- 日本語：日本の塾での用途のため -->
<html lang="ja">
  <head>
    <title>【塾向け】シフトサービス -スプレッドシートにサイトから簡単反映-</title>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- スタイルシートを読み込む -->
    <?!= HtmlService.createHtmlOutputFromFile("Style").getContent(); ?>
  </head>

  <body>
    <main class="page-container">
      <section class="form-card">
        <div class="page-heading">
          <h1>シフト提出</h1>
          <p>勤務日と授業時間を入力してください</p>
        </div>

        <div class="form-group">
          <label for="schoolName"> 校舎名 </label>
          <select id="schoolName" onchange="filterMembersBySchool()">
            <option value="">読み込み中...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="userName"> 名前 </label>
          <select id="userName" disabled>
            <option value="">先に校舎名を選択してください</option>
          </select>
        </div>

        <div class="form-group">
          <label> 勤務日 </label>
          <button type="button" class="calendar-open-button" onclick="openCalendarModal()">
            カレンダーから選択
          </button>
          <div id="selectedDatesDisplay" class="selected-dates-display">
            日付が選択されていません
          </div>
        </div>

        <div class="form-section">
          <div class="section-heading">
            <div>
              <h2>スタッフ勤務希望時間</h2>
              <p>選択したすべての日に適用されます</p>
            </div>
          </div>

          <div class="time-row">
            <div class="time-field">
              <label for="staffStart"> 開始時間 </label>
              <select id="staffStart">
                <option value="">読み込み中...</option>
              </select>
            </div>

            <span class="time-separator"> 〜 </span>

            <div class="time-field">
              <label for="staffEnd"> 終了時間 </label>
              <select id="staffEnd">
                <option value="">読み込み中...</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="section-heading">
            <div>
              <h2>スタッフシフト内授業時間</h2>
              <p>3件連続なら13:00~16:00など</p>
              <p>最大7件まで追加できます</p>
            </div>
            <span id="lessonCount"> 1 / 7件 </span>
          </div>

          <div id="lessonList" class="lesson-list"></div>

          <button
            id="addLessonButton"
            type="button"
            class="add-lesson-button"
            onclick="addLessonRow()"
          >
            ＋ 授業時間を追加
          </button>
        </div>

        <button id="submitButton" type="button" class="submit-button" onclick="sendShifts()">
          シフトを送信
        </button>
        <p id="message" class="message" aria-live="polite"></p>
      </section>
    </main>

    <div id="calendarModal" class="modal-overlay" onclick="handleModalBackgroundClick(event)">
      <div class="calendar-modal" role="dialog" aria-modal="true" aria-labelledby="calendarTitle">
        <div class="modal-handle"></div>

        <div class="calendar-header">
          <button type="button" class="month-button" aria-label="前の月" onclick="changeMonth(-1)">
            ＜
          </button>
          <h2 id="calendarTitle"></h2>
          <button type="button" class="month-button" aria-label="次の月" onclick="changeMonth(1)">
            ＞
          </button>
        </div>

        <div class="weekday-row">
          <div>日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>

        <div class="calendar-summary">
          <span id="temporaryDateCount"> 0日選択中 </span>
        </div>

        <div class="calendar-footer">
          <button type="button" class="secondary-button" onclick="clearTemporaryDates()">
            選択解除
          </button>
          <button type="button" class="secondary-button" onclick="closeCalendarModal()">
            キャンセル
          </button>
          <button type="button" class="confirm-button" onclick="confirmSelectedDates()">
            決定
          </button>
        </div>
      </div>
    </div>

    <!-- 講師がシフトを入力して、送信できるようにする -->
    <script>
      const MAX_LESSONS = 7; // 授業時間カードの追加上限。マジックナンバーを避けるためにこちらに記載。
      let allMembers = []; // 全スタッフデータ。校舎切替の度に通信しなくていいよう、最初に1回だけ取得して保存
      let allTimes = []; // 時間の選択肢一覧。スプシに時間選択肢列があるのでそこから取得。allMembersと同じ理由でここに保存。
      let selectedDates = []; // 送信予定の勤務日。「決定」ボタンを押した時だけ追加。
      let temporarySelectedDates = []; // カレンダーモーダル内で編集中の下書き。「キャンセル」が押下されたなら本番影響はしない。
      let currentCalendarDate = new Date(); // カレンダーが今表示している年月。初期値は今日。前月/次月ボタンをまたぎ覚えたいので関数前に配置。
      loadMembers(); // メンバーを取得
      loadTimeOptions();
      updateLessonRows();

      // 総メンバーを取得
      function loadMembers() {
        const schoolSelect = document.getElementById("schoolName"); // 学校名を保存
        const userSelect = document.getElementById("userName"); // スタッフ名を保存

        // GASとの非同期通信用のクラス。クライアントサイトAPI。
        google.script.run
          // .withSuccessHandler(f)メソッド: サーバー側関数が正常に返された場合実行する。
          .withSuccessHandler(function (result) {
            // サーバーから取得されたスタッフを保存
            allMembers = result.members || [];
            // プルダウンの中身をリセット。1個だけの選択肢にし、読み込み中というデフォルト表示を消す。
            schoolSelect.innerHTML = '<option value="">' + "校舎名を選択してください" + "</option>";
            // サーバーから送られてきた校舎名を1個の校舎名につき1つのoptionタグを作る
            // ここは populateTimeSelect のように別関数へ切り出していない。
            // 校舎名のプルダウンはここ1箇所にしか出てこないため、
            // 関数化しても再利用先が無く、あえて分けるメリットが薄いと判断したため。
            result.schools.forEach(function (schoolName) {
              // optionタグを作り、optionと命名
              const option = document.createElement("option");
              // optionのvalueに校舎名、表示にも校舎名を保存
              option.value = schoolName;
              option.textContent = schoolName;
              // 上ではoptionタグを作っただけなのでそれをschoolSelectを通してselectタグに保存
              schoolSelect.appendChild(option);
            });
            // loadMembers()自体が再度呼ばれた場合に備えて、userSelectも未選択状態に戻す
            // (普段の校舎切り替えはfilterMembersBySchoolが別で担当しており、ここは関係しない)
            userSelect.innerHTML =
              '<option value="">' + "先に校舎名を選択してください" + "</option>";
            userSelect.disabled = true;
          })
          // .withFailureHandler(f)メソッド: サーバー側関数が例外をスローした場合に実行するコールバック関数
          // エラーが起きれば、校舎名・ユーザー名プルダウンに取得できなかった旨のoptionを追加
          // また、通常通りユーザー名は選べないように
          .withFailureHandler(function (error) {
            schoolSelect.innerHTML = '<option value="">' + "取得できませんでした" + "</option>";
            userSelect.innerHTML = '<option value="">' + "取得できませんでした" + "</option>";
            userSelect.disabled = true;
          })
          // gs側のgetMembers()を呼ぶ。成功なら.withSuccessHandler(f)を、失敗なら.withFailureHandler(f)を呼ぶ。
          .getMembers();
      }

      // gs側のgetTimeOptions()を読んで、staffStartとstaffEndタグを作る
      // loadTimeOptions()ではgs呼び出しとoptionタグ生成を分ける。
      function loadTimeOptions() {
        google.script.run
          // サーバー接続成功時
          .withSuccessHandler(function (result) {
            allTimes = result.times || [];
            // オプションタグを時間ごとに作る
            populateTimeSelect(document.getElementById("staffStart"));
            populateTimeSelect(document.getElementById("staffEnd"));
          })
          // サーバー接続失敗時
          // エラーで空を吐く
          .withFailureHandler(function (error) {})
          // gs側のスプシから時間一覧を取得する関数を呼ぶ
          .getTimeOptions();
      }

      // HTMLタグを受け取り、中にoptionタグを入れる関数
      function populateTimeSelect(select) {
        // デフォルトの内容へリセット
        select.innerHTML = '<option value="">' + "選択してください" + "</option>";

        // 時間ごとにoptionタグを作り、valueと表示に時間を入れる
        // select.appendChild(option)で実際のselectタグに保存
        allTimes.forEach(function (time) {
          const option = document.createElement("option");
          option.value = time;
          option.textContent = time;
          select.appendChild(option);
        });
      }

      // 校舎名に基づきスタッフを絞り込む
      function filterMembersBySchool() {
        // 校舎名に入力された校舎名をschoolNameに保存
        const schoolName = document.getElementById("schoolName").value;
        // userNameタグの中身をuserSelectで扱いやすくする
        const userSelect = document.getElementById("userName");
        // userSelectの中身を空文字で初期化する
        userSelect.innerHTML = "";
        // 校舎名がなければuserSelectは触れないようにする
        if (!schoolName) {
          userSelect.innerHTML = '<option value="">' + "先に校舎名を選択してください" + "</option>";
          userSelect.disabled = true;
          return;
        }
        // 校舎名がある場合、allMembersの中から、
        // 選択された校舎名と適している校舎名を持つスタッフをフィルタリング
        const filteredMembers = allMembers.filter(function (member) {
          return member.school_name === schoolName;
        });

        // スタッフ選択ボックスも初期化
        userSelect.innerHTML = '<option value="">' + "名前を選択してください" + "</option>";

        // 校舎が一致するメンバーごとにoptionを作る
        // userSelect.appendChild(option)で実際のslectボックスに保存
        filteredMembers.forEach(function (member) {
          const option = document.createElement("option");
          option.value = member.name;
          option.textContent = member.name;
          userSelect.appendChild(option);
        });

        // スタッフ選択ボックスを選択できる状態にする
        userSelect.disabled = false;
      }

      // 授業時間カードをMAX_LESSONSの数値まで作成できるようにする
      function addLessonRow() {
        const lessonList = document.getElementById("lessonList");
        // 今何個の授業時間カードが画面にあるか数える
        // lessonListの中にある.lesson-rowを探しlessonRowsに一覧を入れる
        const lessonRows = lessonList.querySelectorAll(".lesson-row");

        //授業時間カードの数が上限値に達したらリターンを返す
        if (lessonRows.length >= MAX_LESSONS) {
          return;
        }

        // 追加の授業時間カード作成部分
        // divタグを作り、その中にclass名と要素を入れる
        const lessonRow = document.createElement("div");
        lessonRow.className = "lesson-row";
        lessonRow.innerHTML = `
        <div class="lesson-row-header">
          <span class="lesson-number">
          </span>
          <button
            type="button"
            class="remove-lesson-button"
            onclick="removeLessonRow(this)"
          >
            削除
          </button>
        </div>

        <div class="lesson-time-row">
          <div class="time-field">
            <label>
              開始時間
            </label>
            <select class="lesson-start">
              <option value="">読み込み中...</option>
            </select>
          </div>

          <span class="time-separator">
            〜
          </span>

          <div class="time-field">
            <label>
              終了時間
            </label>
            <select class="lesson-end">
              <option value="">読み込み中...</option>
            </select>
          </div>
        </div>
      `;

        lessonList.appendChild(lessonRow);
        // 開始時間と終了時間のリストを追加する
        populateTimeSelect(lessonRow.querySelector(".lesson-start"));
        populateTimeSelect(lessonRow.querySelector(".lesson-end"));
        updateLessonRows();
      }

      function removeLessonRow(button) {
        button.closest(".lesson-row").remove();
        updateLessonRows();
      }

      // 授業時間カードの増加分を表示
      function updateLessonRows() {
        // 現在の授業時間カードの数を確認
        const lessonRows = document.querySelectorAll(".lesson-row");

        // 授業時間カードの数だけ授業1、授業2と数を増やす
        lessonRows.forEach(function (row, index) {
          row.querySelector(".lesson-number").textContent = "授業 " + (index + 1);
        });

        // 総授業数を〇/MAX件として表示
        document.getElementById("lessonCount").textContent =
          lessonRows.length + " / " + MAX_LESSONS + "件";
        // 授業時間カード追加ボタンを授業追加の上限まできたら触れないようにする
        document.getElementById("addLessonButton").disabled = lessonRows.length >= MAX_LESSONS;
      }

      // 入力された授業時間を{start: ..., end: ...}とsendShifts()がサーバーに送れるデータとしてまとめる
      // 返ってくる想定配列 [{ start: "16:00", end: "18:00" },{ start: "19:00", end: "22:00" },]

      function getLessons() {
        // 追加されている授業時間を取得
        const lessonRows = document.querySelectorAll(".lesson-row");

        // querySelectorAll()はNodeListを返す。配列を返さないので Array.from(対象)で配列に変換しmapを使ってる
        // map(f(){処理})にて想定配列の中身オブジェクト1つずつを作る
        return Array.from(lessonRows).map(function (row) {
          return {
            start: row.querySelector(".lesson-start").value,
            end: row.querySelector(".lesson-end").value,
          };
        });
      }

      // カレンダーモーダルの動作部分
      //
      function openCalendarModal() {
        // = selectedDatesと書くと、selectedDatesも変わってしまうためスプレッド構文を利用
        temporarySelectedDates = [...selectedDates];
        // calendarModalに開いているという状態のクラスを追加
        document.getElementById("calendarModal").classList.add("is-open");
        // modal-openというクラスをbodyに追加
        // Style.htmlにてモーダルを開いている際背景ページをスクロールできないように設計しているため追加。
        document.body.classList.add("modal-open");
        // カレンダーモーダルの中身（今月のカレンダーの日付など）を描画
        renderCalendar();
      }

      // カレンダーモーダルを閉じる際の設計
      // openの際と逆の手順
      function closeCalendarModal() {
        document.getElementById("calendarModal").classList.remove("is-open");
        document.body.classList.remove("modal-open");
      }

      // 閉じるボタンだけでなくモーダルの背景がおされても閉じられるように修正
      // event.target.id（実際にクリックされた要素そのもの）でcalendarModalが押されたら閉じる
      // モーダルを開いたタイミングでcalendarModalがサイト全体に広がる。
      // 中身以外の外側（calendarModal）が押された時だけ閉じる
      function handleModalBackgroundClick(event) {
        if (event.target.id === "calendarModal") {
          closeCalendarModal();
        }
      }

      // ピッカーで前月が押されたら前月に。次月なら次月に飛ぶ関数
      function changeMonth(amount) {
        currentCalendarDate = new Date(
          currentCalendarDate.getFullYear(),
          currentCalendarDate.getMonth() + amount,
          1,
        );
        renderCalendar();
      }

      // currentCalendarDateが指している月のカレンダーを丸ごと書き直す関数
      function renderCalendar() {
        const year = currentCalendarDate.getFullYear(); // 今表示してるページの年
        const month = currentCalendarDate.getMonth(); // 今表示してるページの月
        const firstWeekday = new Date(year, month, 1).getDay(); // 表示されている月の初日が何曜か
        const lastDate = new Date(year, month + 1, 0).getDate(); // 当月の最終日が何日か
        const title = document.getElementById("calendarTitle"); // カレンダーのタイトル
        const grid = document.getElementById("calendarGrid"); // カレンダーの日付を並べる場所

        title.textContent = year + "年 " + (month + 1) + "月"; // タイトルに現在表示中の年月を入れる
        // カレンダーの日付並べる場所を初期化
        grid.innerHTML = "";

        // gridの中で初日の曜日までを空のdivタグで埋める
        for (let i = 0; i < firstWeekday; i++) {
          const empty = document.createElement("div");
          empty.className = "calendar-empty";
          grid.appendChild(empty);
        }

        //　月の最終日までボタンタイプの日付を作成
        for (let day = 1; day <= lastDate; day++) {
          // formatDate(year, month, day)で "2026-08-05"のような文字列に組み替える
          // 月日を必ず2桁に揃える。揃えないと文字列として並び替えたときに "10" が "9" より前に来てしまう
          const dateString = formatDate(year, month, day);
          // 日付ごとにボタンタグを作る
          const button = document.createElement("button");
          button.type = "button";
          button.className = "calendar-date";
          // 日付を表示
          button.textContent = day;

          // 選択された日付に選択中というクラスを付与する
          if (temporarySelectedDates.includes(dateString)) {
            button.classList.add("is-selected");
          }

          // 日付がクリックされたことを感知しtoggleDate()を起動
          button.addEventListener("click", function () {
            toggleDate(dateString);
          });

          grid.appendChild(button);
        }

        updateTemporaryDateCount();
      }

      // 日付の選択 & 選択解除切替（トグル）管理部分
      function toggleDate(dateString) {
        // 日付が下書き選択の中にあるかを調べる
        // ある場合 = そのインデックスを返す
        // ない場合 = -1を返す
        const index = temporarySelectedDates.indexOf(dateString);

        // 日付が追加されてなければ追加
        if (index === -1) {
          temporarySelectedDates.push(dateString);
          // 追加されていれば削除
        } else {
          temporarySelectedDates.splice(index, 1);
        }

        // カレンダーを再描画
        renderCalendar();
      }

      // 日付選択情報を全削除部分
      function clearTemporaryDates() {
        temporarySelectedDates = [];
        renderCalendar();
      }

      // 日付何日選択中か反映部分
      function updateTemporaryDateCount() {
        document.getElementById("temporaryDateCount").textContent =
          temporarySelectedDates.length + "日選択中";
      }

      // カレンダーモーダルを確定し閉じる部分
      function confirmSelectedDates() {
        // 一時日付選択情報を確定情報へ反映
        selectedDates = [...temporarySelectedDates];
        // 日付順に並べ替え（dataStringの形にしてないとずれる）
        selectedDates.sort();
        updateSelectedDatesDisplay();
        closeCalendarModal();
      }

      // 何日選択しているかをカレンダー下に表示
      function updateSelectedDatesDisplay() {
        const display = document.getElementById("selectedDatesDisplay");

        if (selectedDates.length === 0) {
          display.textContent = "日付が選択されていません";
          display.classList.remove("has-dates");
          return;
        }

        display.innerHTML = "";
        display.classList.add("has-dates");

        selectedDates.forEach(function (date) {
          const chip = document.createElement("span");
          chip.className = "date-chip";
          chip.textContent = formatDisplayDate(date);
          display.appendChild(chip);
        });
      }

      // String
      function formatDate(year, month, day) {
        // 人が読む月番号（8月=8）にするためにmonth + 1している。
        // また、padStart()にて必ず2ケタかつ、7であれば07にしている
        const formattedMonth = String(month + 1).padStart(2, "0");
        // 日番号も同様
        const formattedDay = String(day).padStart(2, "0");
        // 2026-02-05のような形にする
        return year + "-" + formattedMonth + "-" + formattedDay;
      }

      // 日付を02/05のような形式にする
      function formatDisplayDate(dateString) {
        const parts = dateString.split("-");
        return Number(parts[1]) + "/" + Number(parts[2]);
      }

      // 送信ボタンが押された際の準備部分
      function sendShifts() {
        // 校舎名
        const schoolName = document.getElementById("schoolName").value;
        // スタッフ名
        const userName = document.getElementById("userName").value;
        // スタッフ開始時間
        const staffStart = document.getElementById("staffStart").value;
        // スタッフ終了時間
        const staffEnd = document.getElementById("staffEnd").value;
        // 授業
        const lessons = getLessons();
        // 提出ボタン
        const submitButton = document.getElementById("submitButton");
        // 送信用にまとめる
        const validationMessage = validateForm(schoolName, userName, staffStart, staffEnd, lessons);

        // 送信の型になっていれば返す
        if (validationMessage) {
          return;
        }

        // 送信の型
        const request = {
          school_name: schoolName,
          user_name: userName,
          selected_dates: selectedDates,
          staff_start: staffStart,
          staff_end: staffEnd,
          lessons: lessons,
        };

        // 送信ボタンは送信中は押せないようにする
        submitButton.disabled = true;
        submitButton.textContent = "送信中...";

        google.script.run
          // 成功すれば上部を初期化しシフトを送信と表示
          .withSuccessHandler(function (result) {
            resetForm();
            submitButton.disabled = false;
            submitButton.textContent = "シフトを送信";
          })
          // 失敗すればそのまま
          .withFailureHandler(function (error) {
            submitButton.disabled = false;
            submitButton.textContent = "シフトを送信";
          })
          // requestをsaveShifts()を通してgsに送る
          .saveShifts(request);
      }

      // 送信情報が足りなければエラーメッセージを出す
      function validateForm(schoolName, userName, staffStart, staffEnd, lessons) {
        if (!schoolName) {
          return "校舎名を選択してください。";
        }

        if (!userName) {
          return "名前を選択してください。";
        }

        if (selectedDates.length === 0) {
          return "勤務日を1日以上選択してください。";
        }

        if (!staffStart || !staffEnd) {
          return "スタッフ勤務時間を入力してください。";
        }

        if (staffStart >= staffEnd) {
          return "スタッフ終了時間は開始時間より後にしてください。";
        }

        for (let i = 0; i < lessons.length; i++) {
          const lesson = lessons[i];

          if (!lesson.start || !lesson.end) {
            return "授業" + (i + 1) + "の時間を入力してください。";
          }

          if (lesson.start >= lesson.end) {
            return "授業" + (i + 1) + "の終了時間は開始時間より後にしてください。";
          }

          if (lesson.start < staffStart || lesson.end > staffEnd) {
            return "授業" + (i + 1) + "はスタッフ勤務時間内に設定してください。";
          }
        }

        return "";
      }

      // 入力された情報を初期化
      function resetForm() {
        const schoolSelect = document.getElementById("schoolName");
        const userSelect = document.getElementById("userName");

        // 校舎名を初期化
        schoolSelect.value = "";
        // スタッフ名を初期化
        userSelect.innerHTML = '<option value="">' + "先に校舎名を選択してください" + "</option>";
        // 校舎名を選ばなければスタッフ名選べない初期状態に
        userSelect.disabled = true;
        // 選んだ確定送信予定シフトを初期化
        selectedDates = [];
        // 選んだリストも初期化
        temporarySelectedDates = [];
        // 画面に表示している選んだ日も初期化
        updateSelectedDatesDisplay();
        document.getElementById("staffStart").value = "";
        document.getElementById("staffEnd").value = "";

        // 授業リストを初期化
        const lessonList = document.getElementById("lessonList");
        lessonList.innerHTML = "";
        updateLessonRows();
      }
    </script>
  </body>
</html>
