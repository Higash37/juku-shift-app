<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="Style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シフト提出</title>
  </head>
  <body>
    <main class="page-container">
      <h1>シフト提出</h1>
      <p>勤務日と授業時間を入力してください</p>
      <div class="form-group">
        <label for="schoolName">校舎名</label>
        <select id="schoolName">
          <option value="">読み込み中...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="userName">名前</label>
        <select id="userName" disabled>
          <option value="">先に校舎名を選択してください</option>
        </select>
      </div>
      <div class="form-group">
        <label>勤務日</label>
        <button type="button" onclick="openCalendarModal()">カレンダーから選択</button>
        <div id="selectedDatesDisplay">日付が選択されていません</div>
      </div>
      <div class="form-group">
        <label for="staffStart">開始時間</label>
        <select id="staffStart">
          <option value="">読み込み中...</option>
        </select>
        <label for="staffEnd">終了時間</label>
        <select id="staffEnd">
          <option value="">読み込み中...</option>
        </select>
      </div>
      <div class="form-section">
        <h2>授業時間</h2>
        <p>最大7件まで追加可能</p>
        <span id="lessonCount">1 / 7件</span>
        <div id="lessonList"></div>
        <button id="addLessonButton" type="button" onclick="addLessonRow()">
          + 授業時間を追加
        </button>
      </div>
      <button id="submitButton" type="button" onclick="sendShifts()">シフトを送信</button>
      <p id="message"></p>
    </main>
    <div id="calendarModal">
      <div class="calendar-modal">
        <div class="calendar-header">
          <button type="button" onclick="changeMonth(-1)">＜</button>
          <h2 id="calendarTitle"></h2>
          <button type="button" onclick="changeMonth(1)">＞</button>
        </div>
        <div class="weekday-row">
          <div>日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
        </div>
        <div id="calendarGrid"></div>
        <div>
          <span id="temporaryDateCount">0日選択中</span>
        </div>
        <div class="calendar-footer">
          <button type="button" onclick="clearTemporaryDates()">選択解除</button>
          <button type="button" onclick="closeCalendarModal()">キャンセル</button>
          <button type="button" onclick="confirmSelectedDates()">決定</button>
        </div>
      </div>
    </div>
    <script>
      let selectedDates = [];
      // +授業時間を追加が押される度に入力欄を動的に作る
      function addLessonRow() {
        // HTML側で作った授業数リストのdivを探してくる
        const lessonList = document.getElementById("lessonList");
        // 授業時間入力欄のカード
        const row = document.createElement("div");
        row.innerHTML = `
        <select class="lesson-start">
          <option value="">読み込み中..</option>
        </select>
          ～
        <select class="lesson-end">
          <option value="">読み込み中..</option>
        </select>
        `;
        // .append() はappendChild()とほぼ同じ動き。文字列も渡せる結構柔軟なメソッド。
        lessonList.append(row);
      }
    </script>
  </body>
</html>
