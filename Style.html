<style>
  * {
    box-sizing: border-box;
  }

  html {
    width: 100%;
    min-height: 100%;

  }

    width: 100%;
    min-height: 100%;
    margin: 0;
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "Yu Gothic", "Meiryo", sans-serif;
    background-color: #f3f5f7;
    color: #202124;
    line-height: 1.6;
  }

  body.modal-open {
    overflow: hidden;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  input,
  select,
  button {
    -webkit-tap-highlight-color: transparent;
  }

    flex-direction: column;

    box-shadow: 0 18px 50px rgba(25, 35, 45, 0.01);

    text-align: center;
  }

  .page-heading h1 {
    margin: 0 0 8px;
    font-size: 30px;
    line-height: 1.3;
    letter-spacing: 0.02em;
  }

  .page-heading p {
    margin: 0;
    color: #6f7780;
    font-size: 15px;
    line-height: 1.6;
  }

    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .form-group > label {
    color: #25292d;
    font-size: 16px;
    font-weight: 700;
  }

      box-shadow 0.15s ease,

  select:hover {
    border-color: #afb7bf;
  }

  select:focus {
    outline: none;
    border-color: #24282c;
    box-shadow: 0 0 0 3px rgba(36, 40, 44, 0.11);
  }

  input:disabled,
  select:disabled {
    cursor: not-allowed;
    background-color: #f1f3f5;
    color: #8b9298;
  }

    display: flex;
    flex-direction: column;
    gap: 10px;

    line-height: 1.4;

    margin: 0;
    color: #737b84;
    font-size: 14px;
    line-height: 1.55;
  }

  #lessonCount {
    flex-shrink: 0;
    padding: 6px 5px;
    border-radius: 999px;
    background-color: #e8edf1;
    color: #596169;
    font-size: 13px;
    font-weight: 700;
  }

  .time-row,
  .lesson-time-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: end;
    gap: 5px;
  }

  .time-field {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .time-field label {
    color: #596169;
    font-size: 14px;
    font-weight: 700;
  }

  .time-separator {
    padding-bottom: 14px;
    color: #737b84;
    font-size: 18px;
    line-height: 1;
  }

  input[type="time"] {
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }

    display: flex;
    flex-direction: column;
    gap: 5px;
  }

    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 5px;
    border: 1px solid #d8dee4;
    border-radius: 13px;
    background-color: #ffffff;
    box-shadow: 0 2px 8px rgba(20, 30, 40, 0.035);
  }

  .lesson-row-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
  }

  .lesson-number {
    color: #292d31;
    font-size: 16px;
    font-weight: 700;
  }

    background-color: #ffe9e6;
  }

  .add-lesson-button {
    width: 100%;
    min-height: 52px;
    padding: 13px 16px;
    border: 1px dashed #9da7b0;
    border-radius: 11px;
    background-color: #ffffff;
    color: #30353a;
    font-size: 15px;
    font-weight: 700;
    transition:
      background-color 0.15s ease,
      border-color 0.15s ease;

    border-color: #767f87;
    background-color: #f1f4f6;
  }

  .add-lesson-button:active {
    background-color: #e9edf0;
  }

    opacity: 0.45;

    background-color: #ffffff;
    color: #25292d;
    font-size: 16px;
    font-weight: 700;
    transition:
      background-color 0.15s ease,
      border-color 0.15s ease;

  .calendar-open-button:hover {
    border-color: #aeb6be;
    background-color: #f2f5f7;
  }

  .calendar-open-button:active {
    background-color: #e9edf0;
  }

  .selected-dates-display {
    min-height: 54px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 12px;
    border: 1px dashed #cbd2d8;
    border-radius: 11px;
    background-color: #ffffff;
    color: #747c84;
    font-size: 15px;
    line-height: 1.5;
  }

  .selected-dates-display.has-dates {
    color: #25292d;
  }

    align-items: center;
    padding: 7px 11px;
    border-radius: 999px;
    background-color: #e8edf1;
    color: #202124;
    font-size: 14px;
    font-weight: 700;
  }

    min-height: 58px;
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    background-color: #202124;
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow: 0 6px 18px rgba(32, 33, 36, 0.18);
    transition:
      opacity 0.15s ease,
      transform 0.15s ease,
      box-shadow 0.15s ease;
  }

  .submit-button:hover {
    opacity: 0.92;
    box-shadow: 0 8px 22px rgba(32, 33, 36, 0.22);
  }

  .submit-button:active {
    transform: scale(0.99);
  }

  .submit-button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
    box-shadow: none;
  }

  .message {
    min-height: 24px;
    margin: 0;
    text-align: center;
    font-size: 15px;
    line-height: 1.6;
  }

  .success-message {
    color: #14733c;
  }

  .error-message {
    color: #c62828;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 10px;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  .modal-overlay.is-open {
    display: flex;
  }

  .calendar-modal {
    width: min(100%, 370px);
    padding: 10px;
    border-radius: 19px;
    background-color: #ffffff;
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.28);
  }

  .modal-handle {
    display: none;
  }

  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    color: #24282c;

    line-height: 1.3;

      transform 0.15s ease;
  }

  .month-button:hover {
    background-color: #dfe4e8;
  }

  .month-button:active {
    transform: scale(0.96);
  }

  .weekday-row,
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
  }

  .weekday-row {
    margin-bottom: 8px;
    text-align: center;
    color: #747c84;
    font-size: 13px;
    font-weight: 700;
  }

  .calendar-date {
    width: 100%;
    aspect-ratio: 1;
  }

  .calendar-date {
    min-width: 0;
    min-height: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: none;
    border-radius: 10px;
    background-color: transparent;
    color: #202124;
    font-size: 15px;
    font-weight: 600;
    transition:
      background-color 0.12s ease,
      color 0.12s ease,
      transform 0.12s ease;
  }

  .calendar-date:hover {
    background-color: #edf0f2;
  }

  .calendar-date:active {
    transform: scale(0.94);
  }

  .calendar-date.is-selected {
    background-color: #202124;
    color: #ffffff;
  }

  .calendar-summary {
    margin-top: 15px;
    text-align: center;
    color: #747c84;
    font-size: 14px;
    font-weight: 600;
  }

  .calendar-footer {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 20px;
  }

  .secondary-button,
  .confirm-button {
    min-height: 48px;
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    transition:

      border-color 0.15s ease,
      opacity 0.15s ease;

  }

  .secondary-button:hover {

  }

    background-color: #202124;
    color: #ffffff;
  }

  .confirm-button:hover {
    opacity: 0.9;

    }

    .time-field label {
      font-size: 15px;
    }

    .lesson-number {
      font-size: 17px;
    }

    .add-lesson-button {
      min-height: 56px;
      font-size: 16px;
    }

    .submit-button {
      min-height: 60px;
      font-size: 18px;
    }
  }

  @media (max-width: 600px) {

      background-color: #ffffff;
    }

    .page-container {
      width: 100%;
      min-height: 100svh;

      padding-right: 4px;
    }

    .form-card {
      width: 100%;
      max-width: none;
      gap: 24px;
      padding: 12px 2px;
      border: none;
      border-radius: 0;
      box-shadow: none;

      margin-right: 8px;
    }

      padding-right: 8px;

  }

      padding-left: 9px;
      padding-right: 9px;
    }

    .form-card {
      gap: 24px;
      padding-left: 3px;
      padding-right: 3px;
    }

    .page-heading h1 {
      font-size: 26px;

    .form-section {
      padding-left: 13px;
      padding-right: 13px;
    }

    .lesson-time-row {

    }
